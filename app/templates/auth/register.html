{% extends "base.html" %}
{% block title %}회원가입 — 전극 코팅 결함 인라인 검사{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">회원가입</h2>
        <p class="auth-subtitle">기본 role 은 inspector 다.
            관리자·매니저 승격은 admin 이 수동으로.</p>

        <form method="POST" action="{{ url_for('auth.register_page') }}" class="auth-form">
            <label class="auth-label">사용자명 <span class="auth-hint">(50자 이하)</span>
                <input class="auth-input" type="text" name="username"
                       value="{{ form.username or '' }}" required autofocus>
            </label>

            <label class="auth-label">비밀번호 <span class="auth-hint">(최소 8자)</span>
                <input class="auth-input" type="password" name="password" required>
            </label>

            <label class="auth-label">비밀번호 확인
                <input class="auth-input" type="password" name="password_confirm" required>
            </label>

            <label class="auth-label">이메일 <span class="auth-hint">(선택)</span>
                <input class="auth-input" type="email" name="email"
                       value="{{ form.email or '' }}">
            </label>

            <label class="auth-label">이름 <span class="auth-hint">(선택)</span>
                <input class="auth-input" type="text" name="full_name"
                       value="{{ form.full_name or '' }}">
            </label>

            <button class="auth-submit" type="submit">가입하기</button>
        </form>

        <p class="auth-link">
            이미 계정이 있나요?
            <a href="{{ url_for('auth.login_page') }}">로그인</a>
        </p>
    </div>
</section>
{% endblock %}
