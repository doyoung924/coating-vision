{% extends "base.html" %}
{% block title %}비밀번호 변경 · 전극 코팅 결함 인라인 검사{% endblock %}
{% block content %}

<section class="history-header">
    <h1 class="page-title">비밀번호 변경</h1>
    <p class="page-desc">
        현재 비밀번호로 본인 확인 후 새 비밀번호로 변경한다. 최소 8자.
        변경 후 세션은 유지된다 (다시 로그인할 필요 없음).
    </p>
    <p class="page-desc">
        <a href="{{ url_for('account.account_page') }}">← 내 정보로 돌아가기</a>
    </p>
</section>

<section class="auth-page" style="padding-top:12px">
    <div class="auth-card" style="max-width: 420px">
        <form method="POST" action="{{ url_for('account.password_page') }}" class="auth-form">
            <label class="auth-label">현재 비밀번호
                <input class="auth-input" type="password" name="current_password" required autofocus>
            </label>
            <label class="auth-label">새 비밀번호 <span class="auth-hint">(최소 8자)</span>
                <input class="auth-input" type="password" name="new_password" required minlength="8">
            </label>
            <label class="auth-label">새 비밀번호 확인
                <input class="auth-input" type="password" name="new_password_confirm" required minlength="8">
            </label>
            <button class="auth-submit" type="submit">변경</button>
        </form>
    </div>
</section>

{% endblock %}
